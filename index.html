<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Мои финансы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);
  --bg2:var(--tg-theme-secondary-bg-color,#f1f1f1);
  --text:var(--tg-theme-text-color,#000);
  --hint:var(--tg-theme-hint-color,#8e8e93);
  --accent:var(--tg-theme-button-color,#2481cc);
  --at:var(--tg-theme-button-text-color,#fff);
  --red:#ff3b30;--green:#34c759;--orange:#ff9500;--purple:#af52de;
  --r:14px;--nav:60px;--hdr:52px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;background:var(--bg2);color:var(--text);min-height:100vh}

/* ── HEADER ── */
.hdr{height:var(--hdr);background:var(--bg);display:flex;align-items:center;padding:0 16px;gap:8px;
  position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(128,128,128,.1)}
.hdr-title{flex:1;font-size:18px;font-weight:700}
.hdr-btn{width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s}
.hdr-btn:active{opacity:.6}
.hdr-btn.add{background:var(--accent);color:var(--at);font-size:22px}
.hdr-btn.share{background:var(--bg2);color:var(--text);font-size:16px}
.hdr-btn.donate{background:var(--bg2);color:#ff3b30;font-size:18px}
.hdr-btn.channel{background:#26A5E4;color:#fff;font-size:18px}
/* ── LAYOUT ── */
.main{padding-bottom:var(--nav)}
.tab{display:none}
.tab.active{display:block}
.tab-body{padding:12px 16px 24px;display:flex;flex-direction:column;gap:8px}

/* ── BOTTOM NAV ── */
.nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav) + env(safe-area-inset-bottom));
  background:var(--bg);border-top:1px solid rgba(128,128,128,.1);display:flex;
  padding-bottom:env(safe-area-inset-bottom);z-index:100}
.nav-btn{flex:1;border:none;background:transparent;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--hint);transition:color .15s}
.nav-btn.active{color:var(--accent)}
.nav-icon{font-size:21px;line-height:1}
.nav-label{font-size:10px;font-weight:500}

/* ── SUMMARY CARD ── */
.sum-card{background:var(--accent);border-radius:var(--r);padding:14px 16px;color:var(--at)}
.sum-card-top{font-size:12px;opacity:.8;margin-bottom:2px}
.sum-card-amt{font-size:28px;font-weight:700;letter-spacing:-.5px}
.sum-card-sub{font-size:12px;opacity:.7;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum-tabs{display:flex;gap:6px;margin-top:10px}
.stab{padding:5px 12px;border-radius:20px;background:rgba(255,255,255,.2);color:rgba(255,255,255,.8);
  border:none;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.stab.active{background:rgba(255,255,255,.95);color:var(--accent)}

/* ── GENERIC CARD ── */
.card{background:var(--bg);border-radius:var(--r);padding:14px;transition:opacity .2s}
.card.off{opacity:.42}
.card-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card-name{flex:1;font-size:15px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-amt{font-size:16px;font-weight:700;color:var(--accent);white-space:nowrap;flex-shrink:0}
.card-note{font-size:11.5px;color:var(--hint);margin-top:6px}
.card-actions{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--bg2)}
.card-btn{flex:1;padding:8px;border-radius:10px;border:none;font-size:12.5px;font-weight:500;cursor:pointer;transition:opacity .15s}
.card-btn:active{opacity:.6}
.card-btn.e{background:var(--bg2);color:var(--text)}
.card-btn.d{background:rgba(255,59,48,.1);color:var(--red)}
.card-btn.link{background:rgba(36,129,204,.1);color:var(--accent);flex:0;padding:8px 12px}

/* ── TOGGLE ── */
.tog{position:relative;width:42px;height:26px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0;position:absolute}
.tog-tr{position:absolute;inset:0;background:#ccc;border-radius:26px;cursor:pointer;transition:background .2s}
.tog-tr::after{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;
  border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.tog input:checked~.tog-tr{background:var(--green)}
.tog input:checked~.tog-tr::after{transform:translateX(16px)}

/* ── PERIOD PILLS ── */
.pills{display:flex;gap:6px}
.pill{flex:1;padding:7px 2px 6px;border-radius:10px;border:1.5px solid transparent;
  background:var(--bg2);color:var(--hint);font-size:11.5px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s}
.pill-sub{font-size:10px;font-weight:400;margin-top:1px;opacity:.8}
.pill.on{background:var(--accent);color:var(--at)}
.pill.na{opacity:.3;cursor:default}

/* ── EXPENSE FREQ BADGE ── */
.freq-badge{font-size:11px;color:var(--hint);background:var(--bg2);padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0}

/* ── SHOPPING ITEMS ── */
.shop-item{background:var(--bg);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:10px}
.shop-chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--hint);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.shop-chk.done{background:var(--green);border-color:var(--green)}
.shop-chk.done::after{content:'✓';font-size:13px;color:#fff;font-weight:700}
.shop-info{flex:1;min-width:0}
.shop-name{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shop-name.done{text-decoration:line-through;opacity:.45}
.shop-meta{font-size:12px;color:var(--hint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shop-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0}
.shop-acts{display:flex;gap:4px;flex-shrink:0}
.icon-btn{width:30px;height:30px;border-radius:50%;border:none;background:var(--bg2);
  cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:opacity .15s}
.icon-btn:active{opacity:.6}
.prog-bar{height:4px;background:var(--bg2);border-radius:2px;overflow:hidden;margin-top:8px}
.prog-fill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}

/* ── WISHLIST CARDS ── */
.wish-card{background:var(--bg);border-radius:var(--r);overflow:hidden}
.wish-img{width:100%;height:160px;object-fit:cover;display:block}
.wish-img-ph{width:100%;height:80px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--hint)}
.wish-body{padding:12px 14px}
.wish-name{font-size:16px;font-weight:700;margin-bottom:6px;line-height:1.3}
.wish-badges{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge.high{background:rgba(255,149,0,.15);color:var(--orange)}
.badge.dream{background:rgba(175,82,222,.15);color:var(--purple)}
.badge.hid{background:var(--bg2);color:var(--hint)}
.badge.booked{background:rgba(52,199,89,.15);color:var(--green)}
.badge.full{background:rgba(52,199,89,.2);color:var(--green)}
.wish-desc{font-size:13px;color:var(--hint);margin-bottom:8px;line-height:1.45}
.wish-price{font-size:18px;font-weight:700;color:var(--accent);margin-bottom:10px}
.wish-price.hid{color:var(--hint);font-size:13px;font-style:italic;font-weight:400}
.wish-footer{display:flex;gap:6px;padding-top:10px;border-top:1px solid var(--bg2);flex-wrap:wrap}
.vis-btn{width:32px;height:32px;border-radius:50%;border:none;background:var(--bg2);cursor:pointer;font-size:14px;flex-shrink:0;transition:opacity .15s}
.vis-btn:active{opacity:.6}

/* ── SHARED VIEW ── */
.sv{position:fixed;inset:0;background:var(--bg2);z-index:300;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity .25s}
.sv.open{opacity:1;pointer-events:all}
.sv-hdr{background:var(--bg);padding:14px 16px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(128,128,128,.1);flex-shrink:0}
.sv-title{flex:1;font-size:17px;font-weight:700}
.sv-close{width:30px;height:30px;border-radius:50%;border:none;background:var(--bg2);cursor:pointer;font-size:16px}
.sv-body{flex:1;overflow-y:auto;padding:12px 16px 40px;display:flex;flex-direction:column;gap:8px}
.sv-owner{font-size:13px;color:var(--hint);text-align:center;padding:4px}

/* ── BOTTOM SHEET ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .22s}
.ov.open{opacity:1;pointer-events:all}
.sheet{width:100%;background:var(--bg);border-radius:20px 20px 0 0;padding:6px 16px;
  padding-bottom:calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .25s cubic-bezier(.4,0,.2,1)}
.ov.open .sheet{transform:translateY(0)}
.sh-handle{width:36px;height:4px;background:var(--bg2);border-radius:2px;margin:8px auto 14px}
.sh-title{font-size:17px;font-weight:700;text-align:center;margin-bottom:18px}
.field{margin-bottom:14px}
.fl{font-size:12px;color:var(--hint);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;padding-left:2px}
.fi{width:100%;padding:12px 14px;border-radius:12px;background:var(--bg2);border:1.5px solid transparent;
  color:var(--text);font-size:15px;outline:none;transition:border-color .15s,background .15s}
.fi:focus{border-color:var(--accent);background:var(--bg)}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pc-label{font-size:11px;color:var(--hint);text-align:center;margin-bottom:4px}
.btn-p{width:100%;padding:14px;border-radius:12px;background:var(--accent);color:var(--at);
  border:none;font-size:16px;font-weight:600;cursor:pointer;margin-top:6px;transition:opacity .15s}
.btn-p:active{opacity:.75}
.btn-s{width:100%;padding:13px;border-radius:12px;background:var(--bg2);color:var(--text);
  border:none;font-size:15px;cursor:pointer;margin-top:8px;transition:opacity .15s}
.btn-s:active{opacity:.65}
.check-row{display:flex;align-items:center;gap:10px;padding:10px 0}
.check-row span{flex:1;font-size:15px}
.sel-group{display:flex;gap:6px;flex-wrap:wrap}
.sel-btn{padding:7px 14px;border-radius:20px;border:1.5px solid var(--bg2);background:var(--bg2);
  color:var(--hint);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.sel-btn.on{border-color:var(--accent);background:var(--accent);color:var(--at)}
.ph-preview{width:100%;height:110px;border-radius:10px;object-fit:cover;margin-top:8px;display:none}
.ph-preview.show{display:block}
.link-box{background:var(--bg2);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--hint);
  word-break:break-all;margin:8px 0;line-height:1.5}

/* ── EMPTY ── */
.empty{text-align:center;padding:60px 24px 24px;color:var(--hint)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-title{font-size:17px;font-weight:600;color:var(--text);margin-bottom:6px}
.empty-sub{font-size:14px;line-height:1.5}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(var(--nav) + 16px);left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.78);color:#fff;padding:9px 20px;border-radius:20px;font-size:14px;
  font-weight:500;z-index:999;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
.toast.show{opacity:1}

/* ── LOADING ── */
.loading{display:flex;align-items:center;justify-content:center;height:50vh;color:var(--hint);font-size:15px;gap:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:20px;height:20px;border:2px solid var(--bg2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}

/* ── TRANSACTION ITEMS ── */
.trans-item{background:var(--bg);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:10px}
.trans-icon{font-size:20px;width:32px;text-align:center;flex-shrink:0}
.trans-info{flex:1;min-width:0}
.trans-name{font-size:15px;font-weight:500}
.trans-meta{font-size:12px;color:var(--hint);margin-top:2px}
.trans-amt{font-size:16px;font-weight:700;white-space:nowrap;flex-shrink:0}
.trans-amt.income{color:var(--green)}
.trans-amt.expense{color:var(--red)}
.trans-acts{display:flex;gap:4px;flex-shrink:0}
.month-nav{display:flex;align-items:center;gap:12px;justify-content:center;padding:8px 0}
.month-nav button{background:var(--bg2);border:none;border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer}
.month-nav span{font-size:16px;font-weight:600;min-width:120px;text-align:center}
.trans-totals{display:flex;gap:8px;justify-content:space-around;background:var(--bg);border-radius:var(--r);padding:10px 16px;margin-bottom:4px}
.trans-totals div{text-align:center}
.trans-totals .label{font-size:11px;color:var(--hint)}
.trans-totals .num{font-size:18px;font-weight:700}
.trans-totals .num.income{color:var(--green)}
.trans-totals .num.expense{color:var(--red)}
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr" id="hdr">
  <div class="hdr-title" id="hdrTitle">💳 Мои Финансы</div>
  <button class="hdr-btn share" id="btnShare" onclick="onShare()" style="display:none">🔗</button>
  <button class="hdr-btn donate" onclick="openDonateLink()" title="Поддержать проект">❤️</button>
  <button class="hdr-btn channel" onclick="openChannel()" title="Наш канал">💬</button>
  <button class="hdr-btn add" onclick="onAdd()">+</button>
</header>

<!-- MAIN -->
<main class="main">
  <div class="tab active" id="tabSubs"><div class="tab-body" id="listSubs"><div class="loading"><div class="spinner"></div>Загрузка…</div></div></div>
  <div class="tab" id="tabTrans"><div class="tab-body" id="listTrans"><div class="loading"><div class="spinner"></div>Загрузка…</div></div></div>
  <div class="tab" id="tabShop"><div class="tab-body" id="listShop"><div class="loading"><div class="spinner"></div>Загрузка…</div></div></div>
  <div class="tab" id="tabWish"><div class="tab-body" id="listWish"><div class="loading"><div class="spinner"></div>Загрузка…</div></div></div>
</main>

<!-- NAV -->
<nav class="nav">
  <button class="nav-btn active" data-t="Subs" onclick="goto('Subs')"><span class="nav-icon">💳</span><span class="nav-label">Подписки</span></button>
  <button class="nav-btn" data-t="Trans" onclick="goto('Trans')"><span class="nav-icon">💰</span><span class="nav-label">Доходы/Расходы</span></button>
  <button class="nav-btn" data-t="Shop" onclick="goto('Shop')"><span class="nav-icon">🛒</span><span class="nav-label">Покупки</span></button>
  <button class="nav-btn" data-t="Wish" onclick="goto('Wish')"><span class="nav-icon">🎁</span><span class="nav-label">Вишлист</span></button>
</nav>

<!-- SHARED VIEW -->
<div class="sv" id="sv">
  <div class="sv-hdr">
    <div class="sv-title" id="svTitle">Вишлист</div>
    <button class="sv-close" onclick="closeSV()">✕</button>
  </div>
  <div class="sv-body" id="svBody"></div>
</div>

<!-- MODAL OVERLAY -->
<div class="ov" id="ov" onclick="ovBg(event)"><div class="sheet" id="sheet"></div></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
/* ────────────────────────────────── TELEGRAM ── */
const tg = window.Telegram?.WebApp;
if (tg){tg.ready();tg.expand();}

/* ────────────────────────────────── DONATE ── */
function openDonateLink() {
    // GA4 событие доната
    gtag('event', 'donate_click', { 'event_category': 'monetization', 'platform': 'Boosty' });
    const donateUrl = 'https://boosty.to/chizzayspeak/donate';
    if (tg && tg.openLink) {
        tg.openLink(donateUrl);
    } else {
        window.open(donateUrl, '_blank');
    }
}

/* ────────────────────────────────── CHANNEL ── */
function openChannel() {
    // GA4 событие открытия канала
    gtag('event', 'channel_click', { 'event_category': 'social', 'channel': 'shoguns_notes' });
    const channelUrl = 'https://t.me/shoguns_notes';
    if (tg && tg.openLink) {
        tg.openLink(channelUrl);
    } else {
        window.open(channelUrl, '_blank');
    }
}

/* ────────────────────────────────── STATE ── */
const S = {
  subs:[], exps:[], shops:[], wishes:[],
  transactions:[],        // новый массив транзакций
  subP:'month', transMonth: new Date(),  // текущий месяц для транзакций
  tab:'Subs', editId:null,
  wPriority:'normal', wHidePrice:false, wVisible:true, wMaxBook:1,
  pendingBookItem:null,
};

/* ────────────────────────────────── STORAGE ── */
const K={subs:'subs_v3', exps:'exps_v1', shops:'shop_v1', wishes:'wish_v1', trans:'trans_v1'};

async function load(key){
  return new Promise(r=>{
    if(tg?.CloudStorage){
      tg.CloudStorage.getItem(key,(err,v)=>{
        if(err||!v)return r(null);
        try{r(JSON.parse(v))}catch{r(null)}
      });
    }else{
      try{const v=localStorage.getItem(key);r(v?JSON.parse(v):null)}catch{r(null)}
    }
  });
}
function save(key,data){
  const v=JSON.stringify(data);
  if(tg?.CloudStorage){tg.CloudStorage.setItem(key,v,e=>e&&console.warn(e));}
  else{try{localStorage.setItem(key,v)}catch{}}
}

/* ────────────────────────────────── DEFAULTS ── */
const DEF_SUBS=[
  {id:'s1',name:'Телеграмм',   active:true,prices:{month:299, year:null,two_years:2990},sel:'two_years',note:'оплата либо в месяц, либо за 2 года', link:'https://telegram.org'},
  {id:'s2',name:'Яндекс Плюс',active:true,prices:{month:449, year:3490,two_years:6980},sel:'two_years',note:'оплата 2 раза в 2 года', link:'https://plus.yandex.ru'},
  {id:'s3',name:'VK Музыка',  active:true,prices:{month:199, year:1599,two_years:3198},sel:'two_years',note:'оплата 2 раза в 2 года', link:'https://vk.com/music'},
  {id:'s4',name:'Делимобиль', active:true,prices:{month:390, year:4680,two_years:9360},sel:'month',    note:'', link:'https://delimobil.ru'},
];

/* ────────────────────────────────── INIT ── */
async function init(){
  const hash=location.hash;
  if(hash.startsWith('#wl=')){const d=dec(hash.slice(4));if(d)showSVWish(d);}
  if(hash.startsWith('#sl=')){const d=dec(hash.slice(4));if(d)showSVShop(d);}

  const [a,b,c,d,e] = await Promise.all([
    load(K.subs), load(K.exps), load(K.shops), load(K.wishes), load(K.trans)
  ]);
  S.subs = a ?? DEF_SUBS;
  S.exps = b ?? [];
  S.shops = c ?? [];
  S.wishes = d ?? [];
  S.transactions = e ?? [];

  rSubs(); rTrans(); rShop(); rWish();
  // Если есть старые расходы, можно перенести их в транзакции (опционально)
  migrateExps();
}

// Перенос старых расходов (exps) в транзакции, если массив транзакций пуст
function migrateExps(){
  if(S.transactions.length === 0 && S.exps.length > 0){
    const today = new Date();
    const y = today.getFullYear(), m = String(today.getMonth()+1).padStart(2,'0'), d = String(today.getDate()).padStart(2,'0');
    const dateStr = `${y}-${m}-${d}`;
    S.exps.forEach(e => {
      S.transactions.push({
        id: uid(),
        type: 'expense',
        amount: e.amt,
        category: 'Регулярный',
        date: dateStr,
        note: e.name + (e.note ? ' ('+e.note+')' : ''),
        active: e.active !== false
      });
    });
    // После переноса очищаем exps, чтобы не дублировать
    S.exps = [];
    save(K.exps, S.exps);
    save(K.trans, S.transactions);
    rTrans();
  }
}

   SUBSCRIPTIONS (добавлена ссылка)

const PL={month:'Месяц',year:'1 год',two_years:'2 года'};
function rSubs(){
  const el=document.getElementById('listSubs');
  const act=S.subs.filter(s=>s.active);
  const total=S.subs.filter(s=>s.active).reduce((a,s)=>a+norm(s.prices[s.sel]??0,s.sel,S.subP),0);
  const detail=act.map(s=>s.name+': '+fmt(Math.round(norm(s.prices[s.sel]??0,s.sel,S.subP)))+'₽').join(' · ');

  el.innerHTML=`<div class="sum-card">
    <div class="sum-card-top">${act.length} из ${S.subs.length} активны</div>
    <div class="sum-card-amt">${fmt(Math.round(total))} ₽</div>
    <div class="sum-card-sub">${esc(detail)||'нет активных'}</div>
    <div class="sum-tabs">
      ${[['month','В месяц'],['year','За год'],['two_years','За 2 года']].map(([p,l])=>`
        <button class="stab ${p===S.subP?'active':''}" onclick="setSubP('${p}')">${l}</button>`).join('')}
    </div></div>`
  +(S.subs.length?S.subs.map(subCard).join(''):`<div class="empty"><div class="empty-icon">💳</div><div class="empty-title">Нет подписок</div><div class="empty-sub">Нажми + чтобы добавить</div></div>`);
}
function subCard(s){
  const pills=['month','year','two_years'].map(p=>{
    const pr=s.prices[p];const isA=s.sel===p;const na=!pr;
    return `<button class="pill ${isA?'on':''} ${na?'na':''}" ${na?'disabled':`onclick="subP('${s.id}','${p}')"`}>
      ${PL[p]}<div class="pill-sub">${pr?fmt(pr)+' ₽':'—'}</div></button>`;
  }).join('');
  const linkBtn = s.link ? `<button class="card-btn link" onclick="openLnk('${esc(s.link)}', 'subscription')">🔗</button>` : '';
  return `<div class="card ${s.active?'':'off'}">
    <div class="card-top">
      <label class="tog"><input type="checkbox" ${s.active?'checked':''} onchange="subTog('${s.id}',this.checked)"><span class="tog-tr"></span></label>
      <span class="card-name">${esc(s.name)}</span>
      <span class="card-amt">${fmt(s.prices[s.sel]??0)} ₽</span>
    </div>
    <div class="pills">${pills}</div>
    ${s.note?`<div class="card-note">📌 ${esc(s.note)}</div>`:''}
    <div class="card-actions">
      ${linkBtn}
      <button class="card-btn e" onclick="mSubs('${s.id}')">✏️ Изменить</button>
      <button class="card-btn d" onclick="delI('subs','${s.id}')">🗑 Удалить</button>
    </div></div>`;
}
function subTog(id,v){const s=S.subs.find(s=>s.id===id);if(s){s.active=v;save(K.subs,S.subs);rSubs();}}
function subP(id,p){const s=S.subs.find(s=>s.id===id);if(s){s.sel=p;save(K.subs,S.subs);rSubs();}}
function setSubP(p){
  S.subP=p;
  // GA4 событие смены периода
  gtag('event', 'sub_period_change', { 'event_category': 'subscription', 'period': p });
  rSubs();
}
function norm(price,from,to){let m=from==='month'?price:from==='year'?price/12:price/24;return to==='month'?m:to==='year'?m*12:m*24;}

function mSubs(id){
  S.editId=id;const s=id?S.subs.find(s=>s.id===id):null;
  openSheet(id?'Изменить подписку':'Добавить подписку',`
    <div class="field"><div class="fl">Название</div><input class="fi" id="fN" value="${s?esc(s.name):''}" placeholder="Например: Spotify"></div>
    <div class="field"><div class="fl">Цены (₽)</div>
      <div class="g3">
        <div><div class="pc-label">В месяц</div><input class="fi" id="fM" type="number" inputmode="decimal" value="${s?.prices.month??''}" placeholder="0"></div>
        <div><div class="pc-label">За год</div><input class="fi" id="fY" type="number" inputmode="decimal" value="${s?.prices.year??''}" placeholder="0"></div>
        <div><div class="pc-label">За 2 года</div><input class="fi" id="f2" type="number" inputmode="decimal" value="${s?.prices.two_years??''}" placeholder="0"></div>
      </div></div>
    <div class="field"><div class="fl">Заметка</div><input class="fi" id="fNote" value="${s?esc(s.note??''):''}" placeholder="Необязательно"></div>
    <div class="field"><div class="fl">Ссылка на сайт</div><input class="fi" id="fLink" type="url" value="${s?esc(s.link??''):''}" placeholder="https://…"></div>
    <button class="btn-p" onclick="saveSubs()">Сохранить</button>
    <button class="btn-s" onclick="closeSheet()">Отмена</button>`);
}
function saveSubs(){
  const n=q('fN').value.trim();if(!n){toast('Введи название');return;}
  const m=pn(q('fM').value),y=pn(q('fY').value),t=pn(q('f2').value);
  if(!m&&!y&&!t){toast('Укажи хотя бы одну цену');return;}
  const note=q('fNote').value.trim(); const link=q('fLink').value.trim();
  const prices={month:m,year:y,two_years:t};
  const isEdit = !!S.editId;
  if(isEdit){const s=S.subs.find(s=>s.id===S.editId);Object.assign(s,{name:n,prices,note,link});if(!prices[s.sel])s.sel=m?'month':y?'year':'two_years';}
  else S.subs.push({id:uid(),name:n,active:true,prices,sel:m?'month':y?'year':'two_years',note,link});
  save(K.subs,S.subs);closeSheet();rSubs();toast(isEdit?'Сохранено ✓':'Добавлено ✓');

  // GA4 событие сохранения подписки
  gtag('event', 'item_saved', {
    'event_category': 'data_entry',
    'item_type': 'subscription',
    'action': isEdit ? 'edit' : 'add'
  });
}

/* ══════════════════════════════════════════════════════════════
   ТРАНЗАКЦИИ (доходы + расходы с датами)
══════════════════════════════════════════════════════════════ */
function rTrans(){
  const el=document.getElementById('listTrans');
  const year = S.transMonth.getFullYear();
  const month = S.transMonth.getMonth();
  const monthStr = `${year}-${String(month+1).padStart(2,'0')}`;
  // фильтруем транзакции за выбранный месяц
  const monthTrans = S.transactions.filter(t => t.date && t.date.startsWith(monthStr));
  const sorted = [...monthTrans].sort((a,b) => (a.date||'').localeCompare(b.date||''));
  const incomes = sorted.filter(t => t.type === 'income');
  const expenses = sorted.filter(t => t.type === 'expense');
  const totalIncome = incomes.reduce((s,t) => s + t.amount, 0);
  const totalExpense = expenses.reduce((s,t) => s + t.amount, 0);
  const balance = totalIncome - totalExpense;

  // Заголовок с итогами
  let html = `<div class="trans-totals">
    <div><div class="label">Доходы</div><div class="num income">+${fmt(totalIncome)} ₽</div></div>
    <div><div class="label">Расходы</div><div class="num expense">-${fmt(totalExpense)} ₽</div></div>
    <div><div class="label">Баланс</div><div class="num" style="color:${balance>=0?'var(--green)':'var(--red)'}">${balance>=0?'+':'-'}${fmt(Math.abs(balance))} ₽</div></div>
  </div>`;

  // Навигация по месяцам
  const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  html += `<div class="month-nav">
    <button onclick="changeMonth(-1)">◀</button>
    <span>${monthNames[month]} ${year}</span>
    <button onclick="changeMonth(1)">▶</button>
  </div>`;

  if(sorted.length === 0){
    html += `<div class="empty"><div class="empty-icon">💰</div><div class="empty-title">За этот месяц записей нет</div><div class="empty-sub">Нажми + чтобы добавить доход или расход</div></div>`;
  } else {
    sorted.forEach(t => {
      const icon = t.type === 'income' ? '📈' : '📉';
      const amtClass = t.type === 'income' ? 'income' : 'expense';
      const sign = t.type === 'income' ? '+' : '-';
      html += `<div class="trans-item">
        <div class="trans-icon">${icon}</div>
        <div class="trans-info">
          <div class="trans-name">${esc(t.note || 'Без описания')}</div>
          <div class="trans-meta">${t.category || 'Без категории'} · ${t.date || ''}</div>
        </div>
        <div class="trans-amt ${amtClass}">${sign}${fmt(t.amount)} ₽</div>
        <div class="trans-acts">
          <button class="icon-btn" onclick="mTrans('${t.id}')">✏️</button>
          <button class="icon-btn" onclick="delI('transactions','${t.id}')">🗑</button>
        </div>
      </div>`;
    });
  }
  el.innerHTML = html;
}

function changeMonth(delta){
  const newDate = new Date(S.transMonth);
  newDate.setMonth(newDate.getMonth() + delta);
  S.transMonth = newDate;
  rTrans();
}

function mTrans(id){
  S.editId=id; const t = id ? S.transactions.find(t=>t.id===id) : null;
  const today = new Date();
  const defDate = t ? t.date : `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  openSheet(id?'Изменить запись':'Добавить запись',`
    <div class="field"><div class="fl">Тип</div>
      <div class="sel-group" id="typeGrp">
        <button class="sel-btn ${t?.type==='income'?'on':''}" onclick="setTransType('income')">📈 Доход</button>
        <button class="sel-btn ${t?.type==='expense'||!t?'on':''}" onclick="setTransType('expense')">📉 Расход</button>
      </div>
    </div>
    <div class="field"><div class="fl">Сумма (₽)</div><input class="fi" id="fAmt" type="number" inputmode="decimal" value="${t?t.amount:''}" placeholder="0"></div>
    <div class="field"><div class="fl">Категория</div><input class="fi" id="fCat" value="${t?esc(t.category||''):''}" placeholder="Например: Еда, Транспорт"></div>
    <div class="field"><div class="fl">Дата</div><input class="fi" id="fDate" type="date" value="${defDate}"></div>
    <div class="field"><div class="fl">Описание</div><input class="fi" id="fNote" value="${t?esc(t.note||''):''}" placeholder="Что это?"></div>
    <button class="btn-p" onclick="saveTrans()">Сохранить</button>
    <button class="btn-s" onclick="closeSheet()">Отмена</button>`);
  // установим активный тип
  window._transType = t?.type || 'expense';
  highlightTransType();
}
function setTransType(type){ window._transType = type; highlightTransType(); }
function highlightTransType(){
  document.querySelectorAll('#typeGrp .sel-btn').forEach((b,i)=>{
    const types = ['income','expense'];
    b.classList.toggle('on', types[i] === window._transType);
  });
}
function saveTrans(){
  const amount = pn(q('fAmt').value);
  if(!amount){toast('Укажи сумму'); return;}
  const category = q('fCat').value.trim();
  const date = q('fDate').value;
  if(!date){toast('Укажи дату'); return;}
  const note = q('fNote').value.trim();
  const type = window._transType || 'expense';
  const isEdit = !!S.editId;
  if(S.editId){
    const t = S.transactions.find(t=>t.id===S.editId);
    if(t){ Object.assign(t, {type, amount, category, date, note}); }
  } else {
    S.transactions.push({id:uid(), type, amount, category, date, note, active:true});
  }
  save(K.trans, S.transactions);
  closeSheet(); rTrans(); toast(isEdit?'Сохранено ✓':'Добавлено ✓');

  // GA4 событие сохранения транзакции
  gtag('event', 'item_saved', {
    'event_category': 'data_entry',
    'item_type': 'transaction',
    'action': isEdit ? 'edit' : 'add'
  });
}

/* ══════════════════════════════════════════════════════════════
   SHOPPING LIST (с категориями)
══════════════════════════════════════════════════════════════ */
function rShop(){
  const el=document.getElementById('listShop');
  if(!S.shops.length){el.innerHTML=`<div class="empty"><div class="empty-icon">🛒</div><div class="empty-title">Список пуст</div><div class="empty-sub">Нажми + чтобы добавить товар</div></div>`;return;}
  // Группировка по категориям
  const cats = {};
  S.shops.forEach(s => {
    const cat = s.category || 'Без категории';
    if(!cats[cat]) cats[cat] = [];
    cats[cat].push(s);
  });
  const done = S.shops.filter(s=>s.chk).length, total=S.shops.length, pct=Math.round(done/total*100);
  let html = `<div class="card" style="padding:12px 14px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <span style="font-size:14px;font-weight:600">${done} из ${total} куплено</span>
      <span style="font-size:13px;color:var(--hint)">${pct}%</span></div>
    <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div></div>`;
  // Сортируем категории
  Object.keys(cats).sort().forEach(cat => {
    const items = cats[cat];
    const doneCat = items.filter(s=>s.chk).length;
    html += `<div style="font-weight:600;font-size:14px;color:var(--hint);margin:12px 0 4px 4px">${esc(cat)} (${doneCat}/${items.length})</div>`;
    const sortedItems = [...items.filter(s=>!s.chk), ...items.filter(s=>s.chk)];
    sortedItems.forEach(item => {
      html += `<div class="shop-item">
        <div class="shop-chk ${item.chk?'done':''}" onclick="shopTog('${item.id}')"></div>
        <div class="shop-info">
          <div class="shop-name ${item.chk?'done':''}">${esc(item.name)}${item.qty?` <span style="color:var(--hint);font-weight:400">× ${esc(String(item.qty))}</span>`:''}</div>
          ${item.note?`<div class="shop-meta">${esc(item.note)}</div>`:''}
        </div>
        ${item.photo?`<img class="shop-thumb" src="${esc(item.photo)}" onerror="this.style.display='none'" alt="">`:``}
        <div class="shop-acts">
          ${item.link?`<button class="icon-btn" onclick="openLnk('${esc(item.link)}', 'shop')">🔗</button>`:''}
          <button class="icon-btn" onclick="mShop('${item.id}')">✏️</button>
          <button class="icon-btn" onclick="delI('shops','${item.id}')">🗑</button>
        </div>
      </div>`;
    });
  });
  el.innerHTML = html;
}
function shopTog(id){const i=S.shops.find(s=>s.id===id);if(i){i.chk=!i.chk;save(K.shops,S.shops);rShop();}}

function mShop(id){

function saveShop(){

const PRL={normal:'',high:'🔥 Хочу',dream:'✨ Мечта'};
function rWish(){
  const el=document.getElementById('listWish');
  if(!S.wishes.length){el.innerHTML=`<div class="empty"><div class="empty-icon">🎁</div><div class="empty-title">Вишлист пуст</div><div class="empty-sub">Добавь что хочешь получить в подарок</div></div>`;return;}
  el.innerHTML=S.wishes.map(w=>{

    return `<div class="wish-card">
      ${w.photo?`<img class="wish-img" src="${esc(w.photo)}" onerror="this.outerHTML='<div class=\\'wish-img-ph\\'>🎁</div>'" alt="">`:

          ${!w.vis?`<span class="badge hid">🙈 Скрыто</span>`:''}
          ${full?`<span class="badge full">✓ Забронировано</span>`:''}
          ${bk>0&&!full?`<span class="badge booked">🤝 ${bk}/${w.maxBook??1} брони</span>`:''}
        </div>
        ${w.desc?`<div class="wish-desc">${esc(w.desc)}</div>`:''}
        ${w.price?(w.hidePrice?`<div class="wish-price hid">Цена скрыта</div>`:`<div class="wish-price">${fmt(w.price)} ₽</div>`):''}
        ${w.bookings?.length?`<div class="card-note" style="margin-bottom:8px">Бронируют: ${w.bookings.map(b=>esc(b.name)).join(', ')}</div>`:''}
        <div class="wish-footer">
          <button class="vis-btn" onclick="wishVis('${w.id}')" title="${w.vis?'Скрыть':'Показать'}">${w.vis?'👁':'🙈'}</button>
          ${w.link?`<button class="card-btn e" style="flex:0;padding:8px 12px" onclick="openLnk('${esc(w.link)}', 'wish')">🔗</button>`:''}
          <button class="card-btn e" style="flex:1" onclick="mWish('${w.id}')">✏️ Изменить</button>
          <button class="card-btn d" style="flex:0;padding:8px 12px" onclick="delI('wishes','${w.id}')">🗑</button>
        </div></div></div>`;
  }).join('');
}
function wishVis(id){const w=S.wishes.find(w=>w.id===id);if(w){w.vis=!w.vis;save(K.wishes,S.wishes);rWish();toast(w.vis?'Видно в шаринге 👁':'Скрыто из шаринга 🙈');}}

function mWish(id){
  S.editId=id;const w=id?S.wishes.find(w=>w.id===id):null;
  S.wPriority=w?.priority??'normal';
  openSheet(id?'Изменить желание':'Добавить желание',`
    <div class="field"><div class="fl">Название</div><input class="fi" id="fN" value="${w?esc(w.name):''}" placeholder="Что хочешь?"></div>
    <div class="field"><div class="fl">Описание</div><input class="fi" id="fD" value="${w?esc(w.desc??''):''}" placeholder="Цвет, размер, детали…"></div>
    <div class="g2">
      <div class="field"><div class="fl">Цена (₽)</div><input class="fi" id="fPr" type="number" inputmode="decimal" value="${w?.price??''}" placeholder="0"></div>
      <div class="field"><div class="fl">Макс. броней</div><input class="fi" id="fMB" type="number" inputmode="numeric" min="1" value="${w?.maxBook??1}"></div></div>
    <div class="field"><div class="fl">Ссылка на товар</div><input class="fi" id="fL" type="url" value="${w?esc(w.link??''):''}" placeholder="https://…"></div>
    <div class="field"><div class="fl">Фото (URL картинки)</div>
      <input class="fi" id="fPh" type="url" value="${w?esc(w.photo??''):''}" placeholder="https://…jpg" oninput="phPrev(this,'wp')">
      <img id="wp" class="ph-preview ${w?.photo?'show':''}" src="${w?.photo??''}" onerror="this.classList.remove('show')" alt=""></div>
    <div class="field"><div class="fl">Приоритет</div>
      <div class="sel-group" id="prGrp">
        ${[['normal','Обычное'],['high','🔥 Хочу'],['dream','✨ Мечта']].map(([v,l])=>`
          <button class="sel-btn ${S.wPriority===v?'on':''}" onclick="setPr('${v}','${l}')">${l}</button>`).join('')}
      </div></div>
    <div class="check-row"><span>Скрыть цену в вишлисте</span>
      <label class="tog"><input type="checkbox" id="chHP" ${w?.hidePrice?'checked':''}><span class="tog-tr"></span></label></div>
    <div class="check-row"><span>Показывать в общем доступе</span>
      <label class="tog"><input type="checkbox" id="chV" ${w?.vis!==false?'checked':''}><span class="tog-tr"></span></label></div>
    <button class="btn-p" onclick="saveWish()">Сохранить</button>
    <button class="btn-s" onclick="closeSheet()">Отмена</button>`);
}
function setPr(v,l){
  S.wPriority=v;
  document.querySelectorAll('#prGrp .sel-btn').forEach((b,i)=>b.classList.toggle('on',['normal','high','dream'][i]===v));
}
function saveWish(){
  const n=q('fN').value.trim();if(!n){toast('Введи название');return;}
  const desc=q('fD').value.trim(),price=pn(q('fPr').value),maxBook=parseInt(q('fMB').value)||1;
  const link=q('fL').value.trim(),photo=q('fPh').value.trim();
  const hidePrice=q('chHP').checked,vis=q('chV').checked;
  const isEdit = !!S.editId;
  if(isEdit){const w=S.wishes.find(w=>w.id===S.editId);Object.assign(w,{name:n,desc,price,maxBook,link,photo,hidePrice,vis,priority:S.wPriority});}
  else S.wishes.push({id:uid(),name:n,desc,price,maxBook,link,photo,hidePrice,vis,priority:S.wPriority,bookings:[]});
  save(K.wishes,S.wishes);closeSheet();rWish();toast(isEdit?'Сохранено ✓':'Добавлено ✓');

  // GA4 событие сохранения желания
  gtag('event', 'item_saved', {
    'event_category': 'data_entry',
    'item_type': 'wish',
    'action': isEdit ? 'edit' : 'add'
  });
}

function doShareWish(){
  const vis=S.wishes.filter(w=>w.vis);
  if(!vis.length){toast('Нет видимых желаний. Включи 👁 для нужных');return;}
  const link=location.origin+location.pathname+'#wl='+enc({wishes:vis});
  S._wishLink=link;
  openSheet('Поделиться вишлистом',`
    <div style="font-size:13px;color:var(--hint);margin-bottom:12px">${vis.length} из ${S.wishes.length} желаний будет видно друзьям</div>
    <div class="link-box">${link.length>80?link.slice(0,80)+'…':link}</div>
    <button class="btn-p" onclick="cpyTxt(S._wishLink,'Ссылка скопирована!')">📋 Скопировать ссылку</button>
    <div style="font-size:12px;color:var(--hint);margin-top:8px">Друзья увидят список и смогут забронировать подарки.<br>Скрытые позиции (🙈) не попадут в ссылку.</div>
    <button class="btn-s" onclick="closeSheet()">Закрыть</button>`);

  // GA4 событие шаринга вишлиста
  gtag('event', 'share_click', { 'event_category': 'sharing', 'share_type': 'wish' });
}

/* ══════════════════════════════════════════════════════════════
   SHARED VIEWS
══════════════════════════════════════════════════════════════ */
function showSVWish(data){
  const wishes=data.wishes||[];
  document.getElementById('svTitle').textContent='🎁 Вишлист';
  document.getElementById('svBody').innerHTML=(wishes.length?wishes.map(w=>{
    const bk=w.bookings?.length??0,full=bk>=(w.maxBook??1);
    return `<div class="wish-card">
      ${w.photo?`<img class="wish-img" src="${esc(w.photo)}" onerror="this.outerHTML='<div class=\\'wish-img-ph\\'>🎁</div>'" alt="">`:
        `<div class="wish-img-ph">🎁</div>`}
      <div class="wish-body">
        <div class="wish-name">${esc(w.name)}</div>
        <div class="wish-badges">
          ${w.priority!=='normal'?`<span class="badge ${w.priority}">${PRL[w.priority]}</span>`:''}
          ${full?`<span class="badge full">✓ Уже бронируют</span>`:''}
          ${bk>0&&!full?`<span class="badge booked">🤝 ${bk} из ${w.maxBook??1}</span>`:''}
        </div>
        ${w.desc?`<div class="wish-desc">${esc(w.desc)}</div>`:''}
        ${w.price&&!w.hidePrice?`<div class="wish-price">${fmt(w.price)} ₽</div>`:''}
        <div class="wish-footer">
          ${w.link?`<button class="card-btn e" style="flex:0;padding:8px 12px" onclick="openLnk('${esc(w.link)}', 'wish')">🔗 Ссылка</button>`:''}
          ${full
            ?`<button class="card-btn e" style="flex:1;opacity:.5" disabled>Уже бронируют</button>`
            :`<button class="btn-p" style="margin:0;flex:1;padding:10px;border-radius:10px" data-wish="${esc(w.name)}" onclick="openBooking(this,'${esc(w.name)}')">🎁 Забронировать</button>`}
        </div></div></div>`;
  }).join(''):`<div class="empty"><div class="empty-icon">🎁</div><div class="empty-title">Список пуст</div></div>`);
  document.getElementById('sv').classList.add('open');
}

function openBooking(btn,wname){
  S.pendingBookItem={btn,name:wname};
  openSheet('Забронировать подарок',`
    <div style="font-size:15px;margin-bottom:16px;line-height:1.4">Вы хотите подарить:<br><strong>${esc(wname)}</strong></div>
    <div class="field"><div class="fl">Ваше имя</div><input class="fi" id="fBN" placeholder="Например: Иван"></div>
    <button class="btn-p" onclick="confirmBook()">✓ Забронировать</button>
    <button class="btn-s" onclick="closeSheet()">Отмена</button>`);
}
function confirmBook(){
  const bn=q('fBN').value.trim();if(!bn){toast('Введи своё имя');return;}
  const {btn,name}=S.pendingBookItem;
  const msg=`🎁 Привет! Я, ${bn}, хочу подарить тебе «${name}»! Бронирую это для тебя 😊`;
  btn.textContent='✓ Забронировано';btn.disabled=true;btn.style.background='var(--green)';
  closeSheet();
  setTimeout(()=>{
    cpyTxt(msg,'Сообщение скопировано! Отправь хозяину вишлиста 🎁');
  },350);
}

function showSVShop(data){
  let st=(data.items||[]).map(i=>({...i,chk:false}));
  document.getElementById('svTitle').textContent='🛒 Список покупок';
  function renderSL(){
    const done=st.filter(s=>s.chk).length,total=st.length,pct=total?Math.round(done/total*100):0;
    document.getElementById('svBody').innerHTML=`
      <div class="card" style="padding:12px 14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <span style="font-size:14px;font-weight:600">${done} из ${total} куплено</span>
          <span style="font-size:13px;color:var(--hint)">${pct}%</span></div>
        <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div></div>`
    +[...st.filter(s=>!s.chk),...st.filter(s=>s.chk)].map(item=>`
      <div class="shop-item">
        <div class="shop-chk ${item.chk?'done':''}" onclick="slTog('${item.id}')"></div>
        <div class="shop-info">
          <div class="shop-name ${item.chk?'done':''}">${esc(item.name)}${item.qty?` <span style="color:var(--hint)">× ${esc(String(item.qty))}</span>`:''}</div>
          ${item.note?`<div class="shop-meta">${esc(item.note)}</div>`:''}
        </div>
        ${item.photo?`<img class="shop-thumb" src="${esc(item.photo)}" onerror="this.style.display='none'" alt="">`:``}
        <div class="shop-acts">${item.link?`<button class="icon-btn" onclick="openLnk('${esc(item.link)}', 'shop')">🔗</button>`:''}</div>
      </div>`).join('');
    window.slTog=id=>{const i=st.find(s=>s.id===id);if(i){i.chk=!i.chk;renderSL();}};
  }
  renderSL();
  document.getElementById('sv').classList.add('open');
}

function closeSV(){document.getElementById('sv').classList.remove('open');history.replaceState(null,'',location.pathname);}

/* ══════════════════════════════════════════════════════════════
   MODAL
══════════════════════════════════════════════════════════════ */
function openSheet(title,body){
  document.getElementById('sheet').innerHTML=`<div class="sh-handle"></div><div class="sh-title">${title}</div>${body}`;
  document.getElementById('ov').classList.add('open');
}
function closeSheet(){document.getElementById('ov').classList.remove('open');}
function ovBg(e){if(e.target===document.getElementById('ov'))closeSheet();}
function phPrev(inp,pid){const img=document.getElementById(pid);if(!img)return;if(inp.value){img.src=inp.value;img.classList.add('show');img.onerror=()=>img.classList.remove('show');}else img.classList.remove('show');}

/* ══════════════════════════════════════════════════════════════
   SHARED ACTIONS
══════════════════════════════════════════════════════════════ */
function delI(sec,id){
  const doIt=()=>{
    let itemType = '';
    if(sec==='transactions'){
      S.transactions = S.transactions.filter(i=>i.id!==id);
      save(K.trans, S.transactions);
      itemType = 'transaction';
      rTrans();
    } else {
      const oldLen = S[sec].length;
      S[sec] = S[sec].filter(i=>i.id!==id);
      save(K[sec], S[sec]);
      if(sec==='subs'){ itemType='subscription'; rSubs(); }
      else if(sec==='shops'){ itemType='shop'; rShop(); }
      else if(sec==='wishes'){ itemType='wish'; rWish(); }
    }
    toast('Удалено');

    // GA4 событие удаления
    gtag('event', 'item_deleted', {
      'event_category': 'data_entry',
      'item_type': itemType
    });
  };
  if(tg)tg.showConfirm('Удалить?',ok=>ok&&doIt());else if(confirm('Удалить?'))doIt();
}
function openLnk(url, source){
  // GA4 событие открытия ссылки, если передан source
  if(source){
    gtag('event', 'link_open', { 'event_category': 'subscription', 'source': source });
  }
  if(tg){try{tg.openLink(url);return;}catch{}}
  window.open(url,'_blank');
}

/* ══════════════════════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════════════════════ */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function fmt(n){return Math.round(n).toLocaleString('ru-RU');}
function pn(v){const n=parseFloat(v);return isNaN(n)||n<=0?null:n;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
function q(id){return document.getElementById(id);}
function enc(d){try{return btoa(unescape(encodeURIComponent(JSON.stringify(d))));}catch{return '';}}
function dec(s){try{return JSON.parse(decodeURIComponent(escape(atob(s))));}catch{return null;}}

let _tt;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),2400);}

function cpyTxt(text,msg){
  if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>toast(msg||'Скопировано! ✓'));}
  else{const el=document.createElement('textarea');el.value=text;document.body.appendChild(el);el.select();try{document.execCommand('copy');toast(msg||'Скопировано! ✓');}catch{}document.body.removeChild(el);}
}

init();
</script>
</body>
</html>
